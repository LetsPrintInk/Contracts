[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc = "0.8.26"
via_ir = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
gas_limit = "18446744073709551615"
remappings = [
  "@openzeppelin/contracts/=node_modules/@openzeppelin/contracts/",
  "v4-core/=node_modules/@uniswap/v4-core/",
  "v4-periphery/=node_modules/@uniswap/v4-periphery/",
  "@uniswap/v4-core/=node_modules/@uniswap/v4-core/",
  "forge-std/=node_modules/@uniswap/v4-core/lib/forge-std/src/",
  "solmate/=node_modules/@uniswap/v4-core/lib/solmate/",
]

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[fuzz]
runs = 1000
